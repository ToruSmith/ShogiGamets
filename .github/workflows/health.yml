name: Health

# 每週巡檢：正式網站還活著、線上對戰連得上 Firebase、相依套件沒有高風險的安全公告。
# 失敗時 GitHub 會寄信通知儲存庫擁有者。也可以在 Actions 頁面手動執行（Run workflow）。
# 注意：儲存庫 60 天沒有任何提交時，GitHub 會自動停用排程，到 Actions 頁面按「Enable workflow」即可恢復。
on:
  schedule:
    - cron: '29 1 * * 1' # 每週一 09:29（台灣時間）
  workflow_dispatch:
    inputs:
      url:
        description: 要檢查的網址（留空是正式網址）
        required: false
  push:
    paths: ['package-lock.json', '.github/workflows/health.yml', 'scripts/smoke.mjs']

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 決定要檢查的網址
        id: site
        env:
          INPUT_URL: ${{ inputs.url }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          url="https://shtoruogigamets.pages.dev/"
          flags="--online"
          if [ -n "$INPUT_URL" ]; then
            url="$INPUT_URL"
          elif [ "$EVENT" = "push" ] && [ "$BRANCH" != "main" ]; then
            # 其他分支檢查 Cloudflare Pages 的預覽網址；預覽版沒有設定 Firebase，所以不測線上
            slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            url="https://${slug}.shtoruogigamets.pages.dev/"
            flags=""
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "檢查 $url $flags"
      - name: 等網站部署好
        env:
          URL: ${{ steps.site.outputs.url }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "$URL"; then exit 0; fi
            sleep 15
          done
          echo "等了十分鐘還是打不開 $URL"; exit 1
      - run: npx playwright install --with-deps chromium
      - name: 網站與線上對戰
        env:
          URL: ${{ steps.site.outputs.url }}
          FLAGS: ${{ steps.site.outputs.flags }}
        run: npm run smoke -- "$URL" $FLAGS
      - name: 相依套件的安全公告（只看會隨網站發佈的套件）
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
